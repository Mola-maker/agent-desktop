[package]
name         = "mola-cua"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.89"
license      = "Apache-2.0"
description  = "Computer use for AI agents on Android devices over adb, with agent-desktop's snapshot, ref and JSON envelope model; desktop commands pass through to agent-desktop."
publish      = false

# Its own workspace: nothing in the upstream workspace (../Cargo.toml) changes, so the fork keeps syncing cleanly.
[workspace]

[dependencies]
# Only the envelope version and the error code names come from core, so both tools speak one contract.
agent-desktop-core = { path = "../crates/core" }
clap       = { version = "4.6", features = ["derive"] }
roxmltree  = "0.20"
serde      = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
